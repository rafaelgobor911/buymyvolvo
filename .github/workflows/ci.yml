name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/buymyvolvo_test
      NEXT_PUBLIC_DEMO_MODE: "true"
      # Test-only value (contact clicks hash IP/UA with it); production sets its own.
      HASH_SALT: ci-only-salt-not-a-secret-000000000000
      # Admin test login for e2e (needs demo mode; never set in a deployed environment).
      ADMIN_EMAILS: admin.teste@example.com
      ADMIN_TEST_LOGIN_EMAIL: admin.teste@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: psql postgresql://postgres:postgres@localhost:5432/postgres -c "create database buymyvolvo_test"
      - run: npm run db:setup
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"
